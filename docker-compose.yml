services:
  postgres:
    image: postgres:15-alpine
    container_name: fluxa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fluxa_db}
      POSTGRES_USER: ${DB_USERNAME:-fluxa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fluxa_password}
    ports:
      # Puerto 5433 en el host para no chocar con un Postgres local.
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-fluxa_user} -d ${DB_NAME:-fluxa_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: fluxa-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@fluxa.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
